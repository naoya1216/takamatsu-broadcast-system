<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<title>通行止め</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>🚧 通行止め</h1>

<label>種別</label>

<select id="closureType">

<option value="plan">通行止め実施予定</option>

<option value="start">通行止め実施</option>

<option value="releasePlan">通行止め解除予定</option>

<option value="release">通行止め解除</option>

</select>

<label>路線</label>

<select id="road" onchange="updateIC()">
    <option>高松自動車道</option>
    <option>高松自動車道坂出支線</option>
    <option>松山自動車道</option>
    <option>高知自動車道</option>
    <option>徳島自動車道</option>
    <option>徳島南部自動車道</option>
</select>

<label>方向</label>

<select id="direction">
    <option>上り線</option>
    <option>下り線</option>
    <option>上下線</option>
</select>

<label>起点IC</label>

<select id="fromIC">

<optgroup label="高松・坂出支線">

<option>さぬき豊中IC</option>
<option>観音寺SIC</option>

</optgroup>

<option>三島川之江IC</option>
<option>土居IC</option>
<option>新居浜IC</option>
<option>いよ西条IC</option>
<option>いよ小松IC</option>
<option>川内IC</option>

<option>内子五十崎IC</option>

</optgroup>

<option>大豊IC</option>
<option>南国IC</option>
<option>高知IC</option>
<option>伊野IC</option>
<option>土佐IC</option>
<option>須崎東IC</option>

</optgroup>



<optgroup label="徳島自動車道">

<option>鳴門JCT</option>
<option>松茂SIC</option>
<option>徳島JCT</option>
<option>藍住IC</option>

</optgroup>

</select>

<select id="toIC">

<optgroup label="高松・坂出支線">

</optgroup>

</select>

<label>時刻</label>

<div class="inline-group">

<input
id="hour"
type="number"
placeholder="時"
min="0"
max="23">

<input
id="minute"
type="number"
placeholder="分"
min="0"
max="59">

</div>

<label>通行止め理由</label>

<select id="reason">

<option>事故</option>
<option>故障車</option>
<option>火災</option>
<option>逆走車</option>
<option>緊急工事</option>

</select>

<button onclick="createClosureCommand()">
放送文作成
</button>

<textarea id="closureText"></textarea>


<button onclick="playClosureCommand()">
🔊 音声再生
</button>

<button onclick="playAcknowledgement()">
📢 了解の合図確認
</button>

<button onclick="playAcknowledged()">
✅ 了解の合図受領
</button>

<button onclick="stopClosureCommand()">
⏹ 停止
</button>

<button onclick="location.href='index.html'">

🏠 メインメニューへ戻る

</button>

</div>

<script src="script.js"></script>
